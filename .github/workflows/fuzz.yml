name: Fuzz

on:
  schedule:
    # Nightly at 03:00 UTC. GitHub disables cron on repos with no
    # activity for 60 days, so re-enable it after long quiet spells.
    - cron: "0 3 * * *"
  # Manual trigger, also the only way to test this before it lands on master.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Install honggfuzz system deps
      run: sudo apt-get update && sudo apt-get install -y binutils-dev libunwind-dev
    - name: Install honggfuzz
      # Version must match the honggfuzz dependency in fuzz/Cargo.lock.
      run: cargo install honggfuzz --version 0.5.62 --locked
    - name: Fuzz for 30 minutes
      run: cd fuzz && cargo hfuzz run fuzz
      env:
        # exit_code_upon_crash is what makes a crash fail the job.
        HFUZZ_RUN_ARGS: "--run_time 1800 --exit_upon_crash --exit_code_upon_crash 1"
    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crashes
        path: fuzz/hfuzz_workspace/
        if-no-files-found: ignore
