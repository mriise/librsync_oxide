[package]
name = "librsync_oxide"
version = "0.3.0"
authors = ["Dropbox Engineering", "bacher09, Artyom Pavlov (RustCrypto/hashes/MD4)"]
license = "Apache-2.0"
description = "An optimized implementation of librsync in pure Rust."
readme = "README.md"
repository = "https://github.com/mriise/librsync_xodie"
keywords = ["rsync"]
edition = "2021"
rust-version = "1.85" 

exclude = [
    ".github",
    ".gitignore",
    "rust-toolchain.toml",
]

[dependencies]
arrayref = "0.3.6"
blake2b_simd = "1.0.5"

[dev-dependencies]
quickcheck = { version = "1.0", default-features = false }
quickcheck_macros = "1.0"
rand = "0.8"
criterion = { version = "0.5", default-features = false }

# librsync-sys (C) does not build with MSVC, so the librsync interoperability
# tests and benchmark comparisons are only compiled on non-Windows targets.
[target.'cfg(not(windows))'.dev-dependencies]
librsync = { git = "https://github.com/goffrie/librsync-rs", rev = "e2e4b06022d889e020c439f2dc92ea2fec0e483e", default-features = false }

[[bench]]
name = "rsync_bench"
harness = false
